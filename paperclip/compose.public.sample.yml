# Public deployment (HTTPS reverse proxy + external PostgreSQL). App settings: /paperclip/instances/default/config.json

services:
  paperclip:
    image: "${PAPERCLIP_IMAGE:-ghcr.io/nov12/paperclip:latest}"
    pull_policy: always
    container_name: paperclip
    restart: unless-stopped

    # UID:GID; mounts must be writable.
    user: "${PUID:-666}:${PGID:-666}"

    # Process limit and shutdown grace period.
    pids_limit: 2048
    stop_grace_period: 90s

    # Host binding; container port is 3100.
    ports:
      - "127.0.0.1:${PAPERCLIP_PORT:-3100}:3100"

    environment:
      # authenticated | local_trusted
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"

      # private | public
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "public"

      # HTTPS browser-facing URL (required).
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:?Set PAPERCLIP_PUBLIC_URL to your HTTPS URL}"

      # auto | explicit
      PAPERCLIP_AUTH_BASE_URL_MODE: "explicit"

      # Extra allowed hostnames (comma-separated); URL hostname is already allowed.
      PAPERCLIP_ALLOWED_HOSTNAMES: "${PAPERCLIP_ALLOWED_HOSTNAMES:-}"

      # Required secrets (generate separately with openssl rand -hex 32; keep stable).
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in shell or .env}"
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: "${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET:?Set PAPERCLIP_TOOL_ACTION_SIGNING_SECRET in shell or .env}"

      # External PostgreSQL URL (required).
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL to your external PostgreSQL URL}"

      # Disable sign-ups after admin setup: true | false
      # PAPERCLIP_AUTH_DISABLE_SIGN_UP: "${PAPERCLIP_AUTH_DISABLE_SIGN_UP:-false}"

      # trace | debug | info | warn | error | fatal | silent
      # PAPERCLIP_LOG_LEVEL: "${PAPERCLIP_LOG_LEVEL:-info}"

      # Auto DB backup: true | false
      # PAPERCLIP_DB_BACKUP_ENABLED: "${PAPERCLIP_DB_BACKUP_ENABLED:-true}"

      # Backup interval in minutes.
      # PAPERCLIP_DB_BACKUP_INTERVAL_MINUTES: "${PAPERCLIP_DB_BACKUP_INTERVAL_MINUTES:-60}"

      # Backup retention in days.
      # PAPERCLIP_DB_BACKUP_RETENTION_DAYS: "${PAPERCLIP_DB_BACKUP_RETENTION_DAYS:-7}"

      # Encryption master key (64 hex chars; reuse when restoring).
      # PAPERCLIP_SECRETS_MASTER_KEY: "${PAPERCLIP_SECRETS_MASTER_KEY:?Set existing encryption key}"

      # local_disk | s3
      # PAPERCLIP_STORAGE_PROVIDER: "${PAPERCLIP_STORAGE_PROVIDER:-local_disk}"

      # S3 bucket, region, optional custom endpoint, and credentials.
      # PAPERCLIP_STORAGE_S3_BUCKET: "${PAPERCLIP_STORAGE_S3_BUCKET:-paperclip}"
      # PAPERCLIP_STORAGE_S3_REGION: "${PAPERCLIP_STORAGE_S3_REGION:-us-east-1}"
      # PAPERCLIP_STORAGE_S3_ENDPOINT: "${PAPERCLIP_STORAGE_S3_ENDPOINT:?Set S3 endpoint URL}"
      # AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      # AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"

      # Path-style S3 URLs: true | false
      # PAPERCLIP_STORAGE_S3_FORCE_PATH_STYLE: "${PAPERCLIP_STORAGE_S3_FORCE_PATH_STYLE:-false}"

      # codex,claude,opencode,gemini,qwen,kimi,copilot,pi,cline,amp,agy | all | none (name@version except agy)
      AGENT_CLIS: "${AGENT_CLIS-codex,claude,opencode,pi,kimi}"

      # Update interval in seconds; 0 = startup only.
      CLI_UPDATE_INTERVAL: "${CLI_UPDATE_INTERVAL:-86400}"

      # skip | update | overwrite
      CLI_INSTALL_MODE: "${CLI_INSTALL_MODE:-update}"

      # go,dotnet,python,uv,rust,node,bun,deno,java | none (supports name@version)
      EXTRA_TOOLS: "${EXTRA_TOOLS-}"

      # Comma-separated Python packages, e.g. requests,ruff (auto-enables python).
      PYTHON_PACKAGES: "${PYTHON_PACKAGES-}"

      # skip | update | overwrite
      TOOLS_INSTALL_MODE: "${TOOLS_INSTALL_MODE:-update}"

      # Startup check interval in seconds; 0 = reuse.
      TOOLS_UPDATE_INTERVAL: "${TOOLS_UPDATE_INTERVAL:-86400}"

      # Proxy URLs.
      # HTTP_PROXY: "${HTTP_PROXY:-}"
      # HTTPS_PROXY: "${HTTPS_PROXY:-}"
      # ALL_PROXY: "${ALL_PROXY:-}"
      # NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,::1}"

      # Provider API keys.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"

    volumes:
      # App data, keys, and backups.
      - paperclip-data:/paperclip

      # CLI logins and tools.
      - paperclip-home:/home/node

      # Project workspace.
      - ./workspace:/workspace

      # Shared CLI/tool mounts across containers.
      # - /srv/shared/agent-cli:/home/node/agent-cli
      # - /srv/shared/extra-tools:/home/node/extra-tools
      # - /srv/shared/pythonlib:/home/node/pythonlib
      # - /srv/shared/uvenvs:/home/node/uvenvs

volumes:
  paperclip-data:
  paperclip-home:
