name: Check common initialization

on:
  pull_request:
    paths:
      - common/**
      - .github/scripts/**
      - .github/workflows/**
      - .github/actionlint.yaml
  push:
    paths:
      - common/**
      - .github/scripts/**
      - .github/workflows/**
      - .github/actionlint.yaml
  workflow_dispatch:
  schedule:
    - cron: "7 3 * * *"

permissions:
  contents: read

jobs:
  shared-tools:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Check GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Check shell syntax
        run: |
          for script in common/*.sh common/extra-tools/*.sh common/tests/*.sh; do
            bash -n "$script"
          done
      - name: Check shell scripts
        run: |
          shellcheck -a -x -P SCRIPTDIR -P common common/init.sh common/python-command.sh common/profile.sh
          # The harness overrides installer functions; lint it without re-analyzing their imported definitions.
          shellcheck -e SC1091,SC2034 common/tests/extra-tools.sh
      - name: Check shared tools and independent version selection
        run: bash common/tests/extra-tools.sh
      - name: Check release resolution and per-tag image retention
        run: python3 -m unittest discover -s .github/scripts/tests -p "test_*.py"
