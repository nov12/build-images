name: Check common initialization

on:
  pull_request:
    paths:
      - common/**
      - .github/workflows/common.check.yml
  push:
    paths:
      - common/**
      - .github/workflows/common.check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Check shell syntax
        run: |
          for script in common/*.sh common/extra-tools/*.sh common/tests/*.sh; do
            bash -n "$script"
          done
      - name: Check shell scripts
        run: |
          shellcheck -a -x -P SCRIPTDIR -P common common/init.sh common/python-command.sh common/profile.sh
          # The harness overrides installer functions; lint it without re-analyzing their imported definitions.
          shellcheck -e SC1091,SC2034 common/tests/extra-tools.sh
      - name: Check shared tools and independent version selection
        run: bash common/tests/extra-tools.sh
