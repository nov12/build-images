name: Check common initialization

on:
  pull_request:
    paths:
      - common/**
      - .github/scripts/**
      - .github/workflows/**
      - .github/actionlint.yaml
  push:
    paths:
      - common/**
      - .github/scripts/**
      - .github/workflows/**
      - .github/actionlint.yaml
  workflow_dispatch:
  schedule:
    - cron: "7 3 * * *"

permissions:
  contents: read

jobs:
  shared-tools:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Check shell syntax
        run: |
          for script in common/*.sh common/extra-tools/*.sh .github/scripts/*.sh; do
            bash -n "$script"
          done
      - name: Check shell scripts
        run: |
          shellcheck -a -x -P SCRIPTDIR -P common common/init.sh common/python-command.sh common/profile.sh
      - name: Check Python scripts syntax
        run: python3 -m py_compile .github/scripts/*.py
