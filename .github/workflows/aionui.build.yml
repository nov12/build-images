name: Build AionUi

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "aionui/**"
      - ".github/workflows/aionui.build.yml"
      - ".github/workflows/docker-release.yml"
  push:
    branches: [main]
    paths:
      - "aionui/**"
      - ".github/workflows/aionui.build.yml"
      - ".github/workflows/docker-release.yml"
  schedule:
    - cron: "31 3 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: aionui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.decision.outputs.build || steps.resolve.outputs.build }}
      args: ${{ steps.resolve.outputs.args }}
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.upstream.outputs.commit }}
      core_tag: ${{ steps.metadata.outputs.core_tag }}
      node_version: ${{ steps.metadata.outputs.node_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api repos/iOfficeAI/AionUi/releases/latest --jq .tag_name)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo 'build=true' >> "$GITHUB_OUTPUT"
      - name: Login for release lookup
        if: github.event_name == 'schedule'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Skip existing multi-platform release
        id: decision
        if: github.event_name == 'schedule'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aionui"
          if docker buildx imagetools inspect "$image:$VERSION" --raw > manifest.json 2>/dev/null && \
             jq -e '[.manifests[] | .platform | "\(.os)/\(.architecture)"] | sort == ["linux/amd64", "linux/arm64"]' manifest.json; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout upstream release
        id: upstream
        uses: actions/checkout@v7
        with:
          repository: iOfficeAI/AionUi
          ref: ${{ steps.resolve.outputs.tag }}
          path: _upstream
          persist-credentials: false
      - name: Resolve matching AionCore
        id: core
        run: |
          set -euo pipefail
          tag="$(jq -r .aioncoreVersion _upstream/package.json)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Checkout matching runtime contract
        uses: actions/checkout@v7
        with:
          repository: iOfficeAI/AionCore
          ref: ${{ steps.core.outputs.tag }}
          path: _core
          persist-credentials: false
          sparse-checkout: crates/aionui-runtime/src/node_runtime
      - name: Verify managed Node contract
        id: metadata
        env:
          CORE_TAG: ${{ steps.core.outputs.tag }}
        run: |
          set -euo pipefail
          file=_core/crates/aionui-runtime/src/node_runtime/managed.rs
          version="$(sed -nE 's/^const MANAGED_NODE_VERSION: &str = "([0-9.]+)";/\1/p' "$file")"
          [[ "$version" =~ ^24\.[0-9]+\.[0-9]+$ ]]
          grep -q 'runtime_from_root(root, ResolvedNodeSource::Managed)' "$file"
          grep -q 'validate_runtime(runtime, None)' "$file"
          echo "core_tag=$CORE_TAG" >> "$GITHUB_OUTPUT"
          echo "node_version=$version" >> "$GITHUB_OUTPUT"

  assets:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout image repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cache architecture-independent WebUI
        id: cache
        uses: actions/cache@v6
        with:
          path: _web_assets
          key: aionui-web-${{ needs.resolve.outputs.sha }}-bun1.4.4-${{ hashFiles('aionui/Dockerfile', '.github/workflows/aionui.build.yml') }}
      - name: Checkout upstream source
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: iOfficeAI/AionUi
          ref: ${{ needs.resolve.outputs.sha }}
          path: _upstream
          persist-credentials: false
      - name: Set up Node.js
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Set up Bun
        if: steps.cache.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Build WebUI once
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: _upstream
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          NODE_ENV=production bun --eval '
            import { resolveConfig } from "electron-vite";
            import { build } from "vite";
            const { config } = await resolveConfig({ configFile: "packages/desktop/electron.vite.config.ts" }, "build", "production");
            if (!config?.renderer) throw new Error("Upstream renderer config missing");
            await build(config.renderer);
          '
          test -s out/renderer/index.html
          mkdir -p ../_web_assets/renderer ../_web_assets/server
          NODE_ENV=production bun build scripts/webui.ts \
            --target=bun --packages=bundle \
            --define 'process.env.NODE_ENV="production"' \
            --outfile=../_web_assets/server/webui.js
          cp -a out/renderer/. ../_web_assets/renderer/
          find ../_web_assets/renderer -type f -name '*.map' -delete
      - name: Download and verify official AionCore releases
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_TAG: ${{ needs.resolve.outputs.core_tag }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            case "$arch" in
              amd64) target=x86_64-unknown-linux-gnu ;;
              arm64) target=aarch64-unknown-linux-gnu ;;
            esac
            archive="aioncore-$CORE_TAG-$target.tar.gz"
            mkdir -p "_assets/$arch/core" "_release/$arch"
            gh release download "$CORE_TAG" --repo iOfficeAI/AionCore \
              --pattern "$archive" --pattern aioncore-checksums.txt --dir "_release/$arch"
            (
              cd "_release/$arch"
              awk -v file="$archive" '$2 == file || $2 == "*" file {print}' aioncore-checksums.txt > selected.sha256
              test "$(wc -l < selected.sha256)" -eq 1
              sha256sum -c selected.sha256
              tar -xzf "$archive" -C "../../_assets/$arch/core" aioncore
            )
            chmod 755 "_assets/$arch/core/aioncore"
            cp -a _web_assets "_assets/$arch/web"
          done
      - name: Upload AMD64 assets
        uses: actions/upload-artifact@v7
        with:
          name: aionui-assets-amd64
          path: _assets/amd64/
          if-no-files-found: error
          retention-days: 1
      - name: Upload ARM64 assets
        uses: actions/upload-artifact@v7
        with:
          name: aionui-assets-arm64
          path: _assets/arm64/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [resolve, assets]
    if: needs.resolve.outputs.build == 'true'
    uses: ./.github/workflows/docker-release.yml
    with:
      project: aionui
      version: ${{ needs.resolve.outputs.version }}
      build-args: AIONCORE_NODE_VERSION=${{ needs.resolve.outputs.node_version }}
      publish: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
