name: Build AionUi

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "aionui/**"
      - "common/**"
      - ".github/scripts/resolve-toolchains.sh"
      - ".github/workflows/aionui.build.yml"
      - ".github/workflows/docker-release.yml"
  push:
    branches: [main]
    paths:
      - "aionui/**"
      - "common/**"
      - ".github/scripts/resolve-toolchains.sh"
      - ".github/workflows/aionui.build.yml"
      - ".github/workflows/docker-release.yml"
  schedule:
    - cron: "31 3 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: aionui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
      args: ${{ steps.resolve.outputs.args }}
      build_key: ${{ steps.resolve.outputs.build_key }}
      node_version: ${{ steps.toolchains.outputs.node_version }}
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.upstream.outputs.commit }}
      core_tag: ${{ steps.metadata.outputs.core_tag }}
      managed_node_version: ${{ steps.metadata.outputs.node_version }}
      bun_version: ${{ steps.toolchains.outputs.bun_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve current LTS toolchains
        id: toolchains
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash -n .github/scripts/resolve-toolchains.sh
          bash .github/scripts/resolve-toolchains.sh bun
      - name: Check startup script syntax
        run: |
          find common -type f -name '*.sh' -print0 | xargs -0 -r -n 1 bash -n
          bash -n aionui/entrypoint.sh
          docker compose -f aionui/compose.sample.yml config --quiet
      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_VERSION: ${{ steps.toolchains.outputs.node_version }}
          BUN_VERSION: ${{ steps.toolchains.outputs.bun_version }}
        run: |
          set -euo pipefail
          tag="$(gh api repos/iOfficeAI/AionUi/releases/latest --jq .tag_name)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          commit="$(gh api "repos/iOfficeAI/AionUi/commits/$tag" --jq .sha)"
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          version="${tag#v}"
          build_key="$(
            {
              printf '%s\n' "$version" "$commit" "$NODE_VERSION" "$BUN_VERSION"
              find common -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
              sha256sum .github/scripts/resolve-toolchains.sh aionui/Dockerfile aionui/entrypoint.sh \
                .github/workflows/aionui.build.yml .github/workflows/docker-release.yml
            } | sha256sum | cut -d ' ' -f1
          )"
          echo "build_key=$build_key" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo 'build=true' >> "$GITHUB_OUTPUT"
      - name: Checkout upstream release
        id: upstream
        uses: actions/checkout@v7
        with:
          repository: iOfficeAI/AionUi
          ref: ${{ steps.resolve.outputs.commit }}
          path: _upstream
          persist-credentials: false
      - name: Resolve matching AionCore
        id: core
        run: |
          set -euo pipefail
          tag="$(jq -r .aioncoreVersion _upstream/package.json)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Checkout matching runtime contract
        uses: actions/checkout@v7
        with:
          repository: iOfficeAI/AionCore
          ref: ${{ steps.core.outputs.tag }}
          path: _core
          persist-credentials: false
          sparse-checkout: crates/aionui-runtime/src/node_runtime
      - name: Verify managed Node contract
        id: metadata
        env:
          CORE_TAG: ${{ steps.core.outputs.tag }}
        run: |
          set -euo pipefail
          file=_core/crates/aionui-runtime/src/node_runtime/managed.rs
          version="$(sed -nE 's/^const MANAGED_NODE_VERSION: &str = "([0-9.]+)";/\1/p' "$file")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -q 'runtime_from_root(root, ResolvedNodeSource::Managed)' "$file"
          grep -q 'validate_runtime(runtime, None)' "$file"
          grep -q 'runtime.version = node_version;' _core/crates/aionui-runtime/src/node_runtime/mod.rs
          printf 'AionUi commit: %s; AionCore %s commit: %s; managed cache key (not a version constraint): %s\n' \
            "$(git -C _upstream rev-parse HEAD)" "$CORE_TAG" "$(git -C _core rev-parse HEAD)" "$version" >> "$GITHUB_STEP_SUMMARY"
          echo "core_tag=$CORE_TAG" >> "$GITHUB_OUTPUT"
          echo "node_version=$version" >> "$GITHUB_OUTPUT"

  assets:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout image repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cache architecture-independent WebUI
        id: cache
        uses: actions/cache@v6
        with:
          path: _web_assets
          key: aionui-web-${{ needs.resolve.outputs.sha }}-node${{ needs.resolve.outputs.node_version }}-bun${{ needs.resolve.outputs.bun_version }}-${{ hashFiles('aionui/Dockerfile', '.github/workflows/aionui.build.yml') }}
      - name: Checkout upstream source
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: iOfficeAI/AionUi
          ref: ${{ needs.resolve.outputs.sha }}
          path: _upstream
          persist-credentials: false
      - name: Set up Node.js
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ needs.resolve.outputs.node_version }}
          package-manager-cache: false
      - name: Set up Bun
        if: steps.cache.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ needs.resolve.outputs.bun_version }}
      - name: Build WebUI once
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: _upstream
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          NODE_ENV=production bun --eval '
            import { resolveConfig } from "electron-vite";
            import { build } from "vite";
            const { config } = await resolveConfig({ configFile: "packages/desktop/electron.vite.config.ts" }, "build", "production");
            if (!config?.renderer) throw new Error("Upstream renderer config missing");
            await build(config.renderer);
          '
          test -s out/renderer/index.html
          mkdir -p ../_web_assets/renderer ../_web_assets/server
          NODE_ENV=production bun build scripts/webui.ts \
            --target=bun --packages=bundle \
            --define 'process.env.NODE_ENV="production"' \
            --outfile=../_web_assets/server/webui.js
          cp -a out/renderer/. ../_web_assets/renderer/
          find ../_web_assets/renderer -type f -name '*.map' -delete
      - name: Download and verify official AionCore releases
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_TAG: ${{ needs.resolve.outputs.core_tag }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            case "$arch" in
              amd64) target=x86_64-unknown-linux-gnu ;;
              arm64) target=aarch64-unknown-linux-gnu ;;
            esac
            archive="aioncore-$CORE_TAG-$target.tar.gz"
            mkdir -p "_assets/$arch/core" "_release/$arch"
            gh release download "$CORE_TAG" --repo iOfficeAI/AionCore \
              --pattern "$archive" --pattern aioncore-checksums.txt --dir "_release/$arch"
            (
              cd "_release/$arch"
              awk -v file="$archive" '$2 == file || $2 == "*" file {print}' aioncore-checksums.txt > selected.sha256
              test "$(wc -l < selected.sha256)" -eq 1
              sha256sum -c selected.sha256
              tar -xzf "$archive" -C "../../_assets/$arch/core" aioncore
              cp selected.sha256 "../../_assets/$arch/core/SHA256SUMS"
            )
            chmod 755 "_assets/$arch/core/aioncore"
            cp -a _web_assets "_assets/$arch/web"
          done
      - name: Upload AMD64 assets
        uses: actions/upload-artifact@v7
        with:
          name: aionui-assets-amd64
          path: _assets/amd64/
          if-no-files-found: error
          retention-days: 1
      - name: Upload ARM64 assets
        uses: actions/upload-artifact@v7
        with:
          name: aionui-assets-arm64
          path: _assets/arm64/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [resolve, assets]
    if: needs.resolve.outputs.build == 'true'
    uses: ./.github/workflows/docker-release.yml
    with:
      project: aionui
      check-numeric-user: true
      numeric-user-mounts: |
        /home/node
        /opt/agent-cli
        /data
      context: .
      check-command: |
        find /usr/local/lib/container-common -type f -name '*.sh' -print0 | xargs -0 -r -n 1 bash -n
        bash -n /usr/local/bin/entrypoint.sh
        AGENT_CLIS=none CLI_UPDATE_INTERVAL=0 /usr/local/bin/entrypoint.sh sh -ec 'aioncore --help >/dev/null; bun --version'
      build-artifact: aionui-assets
      build-contexts: |
        web-assets=./_build/web
        core-bin=./_build/core
      upstream-repository: iOfficeAI/AionUi
      version: ${{ needs.resolve.outputs.version }}
      build-args: |
        NODE_VERSION=${{ needs.resolve.outputs.node_version }}
        BUN_IMAGE=oven/bun:${{ needs.resolve.outputs.bun_version }}-slim
        AIONCORE_NODE_VERSION=${{ needs.resolve.outputs.managed_node_version }}
      upstream-revision: ${{ needs.resolve.outputs.sha }}
      build-key: ${{ needs.resolve.outputs.build_key }}
      security-rebuild: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      record-build: true
      record-command: |
        node --version
        npm --version
        bun --version
        sha256sum /usr/local/bin/bun /usr/local/bin/aioncore
        find /usr/local/share/build-images -type f -print -exec cat {} \;
        dpkg-query -W
      check-startup: true
      startup-timeout: 300
      startup-command: |
        docker run -d --network none \
          -e AGENT_CLIS=none -e EXTRA_TOOLS=none -e PYTHON_PACKAGES=none \
          -e CLI_UPDATE_INTERVAL=0 "$CHECK_IMAGE"
      startup-check-command: |
        docker exec "$CHECK_CONTAINER" /usr/local/bin/node --input-type=module -e '
          const health = await fetch("http://127.0.0.1:25808/api/auth/status", { signal: AbortSignal.timeout(4000) });
          if (!health.ok) throw new Error("AionUi health check failed");
          const response = await fetch("http://127.0.0.1:25808/", { signal: AbortSignal.timeout(4000) });
          if (!response.ok || !(await response.text()).toLowerCase().includes("<html")) throw new Error("Missing Web UI");
        '
        docker exec "$CHECK_CONTAINER" bash -ec '
          cache_version="$(cat /usr/local/share/aionui/managed-node-version)"
          architecture="$(/usr/local/bin/node -p process.arch)"
          actual="$(/usr/local/bin/node -p process.versions.node)"
          runtime="${AIONUI_DATA_DIR:-$HOME/.aionui-web}/runtime/node/node-v$cache_version-linux-$architecture"
          test -L "$runtime"
          test "$("$runtime/bin/node" -p process.versions.node)" = "$actual"
          "$runtime/bin/npm" --version
          "$runtime/bin/npx" --version
        '
        docker logs "$CHECK_CONTAINER" 2>&1 | grep -F 'managed runtime background preparation completed' >/dev/null
      publish: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
