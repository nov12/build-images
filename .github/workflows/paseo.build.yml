name: Build Paseo

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "paseo/**"
      - "common/**"
      - ".github/scripts/resolve-toolchains.sh"
      - ".github/workflows/paseo.build.yml"
      - ".github/workflows/docker-release.yml"
  push:
    branches: [main]
    paths:
      - "paseo/**"
      - "common/**"
      - ".github/scripts/resolve-toolchains.sh"
      - ".github/workflows/paseo.build.yml"
      - ".github/workflows/docker-release.yml"
  schedule:
    - cron: "31 3 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: paseo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
      args: ${{ steps.resolve.outputs.args }}
      build_key: ${{ steps.resolve.outputs.build_key }}
      node_version: ${{ steps.toolchains.outputs.node_version }}
      upstream_commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve current LTS toolchains
        id: toolchains
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash -n .github/scripts/resolve-toolchains.sh
          bash .github/scripts/resolve-toolchains.sh
      - name: Check startup script syntax
        run: |
          find common -type f -name '*.sh' -print0 | xargs -0 -r -n 1 bash -n
          bash -n paseo/entrypoint.sh
          node --check paseo/plugins.mjs
          PASEO_PASSWORD=configuration-only docker compose -f paseo/compose.sample.yml config --quiet
      - name: Resolve stable release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_VERSION: ${{ steps.toolchains.outputs.node_version }}
        run: |
          set -euo pipefail
          tag="$(gh api repos/getpaseo/paseo/releases/latest --jq .tag_name)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          commit="$(gh api "repos/getpaseo/paseo/commits/$tag" --jq .sha)"
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          printf 'Source release %s commit: %s\n' "$tag" "$commit" >> "$GITHUB_STEP_SUMMARY"
          version="${tag#v}"
          test "$(npm view "@getpaseo/cli@$version" version)" = "$version"
          npm view "@getpaseo/cli@$version" version dist.integrity --json >> "$GITHUB_STEP_SUMMARY"
          build_key="$(
            {
              printf '%s\n' "$version" "$commit" "$NODE_VERSION"
              find common -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
              sha256sum .github/scripts/resolve-toolchains.sh paseo/Dockerfile paseo/entrypoint.sh paseo/plugins.mjs \
                .github/workflows/paseo.build.yml .github/workflows/docker-release.yml
            } | sha256sum | cut -d ' ' -f1
          )"
          {
            echo "args=PASEO_VERSION=$version"
            echo "version=paseo-$version"
            echo "build_key=$build_key"
            echo 'build=true'
          } >> "$GITHUB_OUTPUT"

  release:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    uses: ./.github/workflows/docker-release.yml
    with:
      project: paseo
      check-numeric-user: true
      numeric-user-mounts: |
        /home/node
        /opt/agent-cli
        /data
      check-command: |
        find /usr/local/lib/container-common -type f -name '*.sh' -print0 | xargs -0 -r -n 1 bash -n
        bash -n /usr/local/lib/paseo/entrypoint.sh
        AGENT_CLIS=none PASEO_PLUGINS=none CLI_UPDATE_INTERVAL=0 /usr/local/lib/paseo/entrypoint.sh paseo --version
      context: .
      upstream-revision: ${{ needs.resolve.outputs.upstream_commit }}
      upstream-repository: getpaseo/paseo
      upstream-version-prefix: paseo-
      version: ${{ needs.resolve.outputs.version }}
      build-args: |
        NODE_VERSION=${{ needs.resolve.outputs.node_version }}
        ${{ needs.resolve.outputs.args }}
      build-key: ${{ needs.resolve.outputs.build_key }}
      security-rebuild: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      record-build: true
      record-command: |
        node --version
        npm --version
        sha256sum /opt/paseo/package-lock.json
        dpkg-query -W
      check-startup: true
      startup-command: |
        docker run -d --network none \
          -e AGENT_CLIS=none -e EXTRA_TOOLS=none -e PYTHON_PACKAGES=none \
          -e PASEO_PLUGINS=none -e PASEO_PASSWORD=offline-startup-check \
          -e CLI_UPDATE_INTERVAL=0 "$CHECK_IMAGE"
      startup-check-command: |
        docker exec "$CHECK_CONTAINER" /usr/local/bin/node --input-type=module -e '
          const response = await fetch("http://127.0.0.1:6767/", { signal: AbortSignal.timeout(4000) });
          if (!response.ok || !(await response.text()).toLowerCase().includes("<html")) throw new Error("Missing Web UI");
        '
        docker exec "$CHECK_CONTAINER" /usr/local/bin/node --input-type=module -e '
          import { createRequire } from "node:module";
          const require = createRequire("/opt/paseo/node_modules/@getpaseo/server/package.json");
          const terminal = require("node-pty").spawn("/bin/sh", ["-c", "printf native-pty-ready"], { name: "xterm", cols: 80, rows: 24 });
          let output = "";
          const timer = setTimeout(() => { terminal.kill(); process.exit(1); }, 10000);
          terminal.onData(data => { output += data; });
          terminal.onExit(({ exitCode }) => { clearTimeout(timer); if (exitCode !== 0 || !output.includes("native-pty-ready")) process.exit(1); });
        '
      publish: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
