name: Build StratForge

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "stratforge/**"
      - ".github/workflows/stratforge.build.yml"
      - ".github/workflows/docker-release.yml"
  push:
    branches: [main]
    paths:
      - "stratforge/**"
      - ".github/workflows/stratforge.build.yml"
      - ".github/workflows/docker-release.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: stratforge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
      args: ${{ steps.resolve.outputs.args }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          groups = tomllib.loads(Path('stratforge/pyproject.toml').read_text())['dependency-groups']
          assert groups['engine-image']
          for role in ('live', 'research'):
              assert {'include-group': 'engine-image'} in groups[f'{role}-image']
          PY
          version="build-$(sha256sum stratforge/Dockerfile stratforge/pyproject.toml | sha256sum | cut -c1-16)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo 'build=true' >> "$GITHUB_OUTPUT"

  release:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    uses: ./.github/workflows/docker-release.yml
    with:
      project: stratforge
      check-command: python -c 'import numpy, talib'
      version: ${{ needs.resolve.outputs.version }}
      roles: '["live", "research"]'
      publish: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
