name: Build T3 Code

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "t3code/**"
      - "common/**"
      - ".dockerignore"
      - ".github/workflows/t3code.build.yml"
      - ".github/workflows/docker-release.yml"
  push:
    branches: [main]
    paths:
      - "t3code/**"
      - "common/**"
      - ".dockerignore"
      - ".github/workflows/t3code.build.yml"
      - ".github/workflows/docker-release.yml"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: t3code-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.decision.outputs.build || steps.resolve.outputs.build }}
      args: ${{ steps.resolve.outputs.args }}
      build_key: ${{ steps.resolve.outputs.build_key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check startup script syntax
        run: |
          find common -type f -name '*.sh' -print0 | xargs -0 -r -n 1 bash -n
          bash common/check.sh
      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api repos/pingdotgg/t3code/releases/latest --jq .tag_name)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          version="t3-${tag#v}"
          build_key="$(
            {
              printf '%s\n' "$version"
              find common -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
              sha256sum .dockerignore t3code/Dockerfile \
                .github/workflows/t3code.build.yml .github/workflows/docker-release.yml
            } | sha256sum | cut -d ' ' -f1
          )"
          {
            echo "args=T3_VERSION=${tag#v}"
            echo "version=$version"
            echo "build_key=$build_key"
            echo 'build=true'
          } >> "$GITHUB_OUTPUT"
      - name: Login for release lookup
        if: github.event_name == 'schedule'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Skip unchanged multi-platform release
        id: decision
        if: github.event_name == 'schedule'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          BUILD_KEY: ${{ steps.resolve.outputs.build_key }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/t3code"
          if docker buildx imagetools inspect "$image:$VERSION" --raw > manifest.json 2>/dev/null && \
             jq -e --arg key "$BUILD_KEY" '
               .annotations["io.build-images.build-key"] == $key and
               ([.manifests[] | .platform | "\(.os)/\(.architecture)"] | sort == ["linux/amd64", "linux/arm64"])
             ' manifest.json; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    uses: ./.github/workflows/docker-release.yml
    with:
      project: t3code
      context: .
      check-command: |
        find /usr/local/lib/container-common -type f -name '*.sh' -print0 | xargs -0 -r -n 1 bash -n
        AGENT_CLIS=none CLI_UPDATE_INTERVAL=0 /usr/local/lib/container-common/entrypoint.sh t3 --help >/dev/null
      upstream-repository: pingdotgg/t3code
      upstream-version-prefix: t3-
      version: ${{ needs.resolve.outputs.version }}
      build-args: ${{ needs.resolve.outputs.args }}
      build-key: ${{ needs.resolve.outputs.build_key }}
      publish: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
