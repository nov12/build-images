name: dev-go / build

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "dev-go/**"
      - ".github/workflows/dev-go.build.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Load versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          source dev-go/versions.env

          {
            echo "python=${PYTHON_VERSION}"
            echo "go=${GO_VERSION}"
            echo "node=${NODE_VERSION}"
            echo "pnpm=${PNPM_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Set image name
        id: image
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${OWNER}/dev-go" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: dev-go
          push: true

          platforms: |
            linux/amd64
            linux/arm64

          build-args: |
            PYTHON_VERSION=${{ steps.versions.outputs.python }}
            GO_VERSION=${{ steps.versions.outputs.go }}
            NODE_VERSION=${{ steps.versions.outputs.node }}
            PNPM_VERSION=${{ steps.versions.outputs.pnpm }}

          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:go-${{ steps.versions.outputs.go }}

          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

          provenance: false

          cache-from: type=gha,scope=dev-go
          cache-to: type=gha,mode=max,scope=dev-go
