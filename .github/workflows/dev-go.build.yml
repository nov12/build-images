name: Build dev-go

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "dev-go/**"
      - "t3code/entrypoint.sh"
      - ".github/workflows/dev-go.build.yml"
      - ".github/workflows/docker-release.yml"
  push:
    branches: [main]
    paths:
      - "dev-go/**"
      - "t3code/entrypoint.sh"
      - ".github/workflows/dev-go.build.yml"
      - ".github/workflows/docker-release.yml"
  schedule:
    - cron: "43 3 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-go-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.decision.outputs.build || steps.resolve.outputs.build }}
      args: ${{ steps.resolve.outputs.args }}
      build_key: ${{ steps.resolve.outputs.build_key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve stable toolchain versions
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 30 'https://go.dev/dl/?mode=json' > "$RUNNER_TEMP/go.json"
          GO_VERSION="$(jq -er '
            [.[] | select(.stable == true) | .version | ltrimstr("go")]
            | sort_by(split(".") | map(tonumber)) | last
          ' "$RUNNER_TEMP/go.json")"
          curl -fsSL --retry 3 --max-time 30 https://nodejs.org/dist/index.json > "$RUNNER_TEMP/node.json"
          NODE_VERSION="$(jq -er '
            [.[] | .version | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))]
            | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | last | ltrimstr("v")
          ' "$RUNNER_TEMP/node.json")"
          curl -fsSL --retry 3 --max-time 30 \
            'https://www.python.org/api/v2/downloads/release/?is_published=true&pre_release=false' > "$RUNNER_TEMP/python.json"
          PYTHON_VERSION="$(jq -er '
            [.[] | select(.is_published == true and .pre_release == false)
              | .name | sub("^Python "; "") | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))]
            | sort_by(split(".") | map(tonumber)) | last
          ' "$RUNNER_TEMP/python.json")"
          task_version="$(gh api repos/go-task/task/releases/latest --jq .tag_name)"
          for version in "$GO_VERSION" "$NODE_VERSION" "$PYTHON_VERSION" "${task_version#v}"; do
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          done
          build_key="$(
            {
              printf '%s\n' "$PYTHON_VERSION" "$GO_VERSION" "$NODE_VERSION" "$task_version"
              sha256sum dev-go/Dockerfile dev-go/entrypoint.sh t3code/entrypoint.sh \
                .github/workflows/dev-go.build.yml .github/workflows/docker-release.yml
            } | sha256sum | cut -d ' ' -f1
          )"
          {
            echo 'args<<BUILD_ARGS'
            echo "PYTHON_VERSION=$PYTHON_VERSION"
            echo "GO_VERSION=$GO_VERSION"
            echo "NODE_VERSION=$NODE_VERSION"
            echo "TASK_VERSION=$task_version"
            echo 'BUILD_ARGS'
            echo "version=go-$GO_VERSION"
            echo "build_key=$build_key"
            echo 'build=true'
          } >> "$GITHUB_OUTPUT"
          printf 'Resolved Go %s, Node %s, Python %s, Task %s\n' "$GO_VERSION" "$NODE_VERSION" "$PYTHON_VERSION" "$task_version"
      - name: Login for release lookup
        if: github.event_name == 'schedule'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Skip unchanged multi-platform release
        id: decision
        if: github.event_name == 'schedule'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          BUILD_KEY: ${{ steps.resolve.outputs.build_key }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dev-go"
          if docker buildx imagetools inspect "$image:$VERSION" --raw > manifest.json 2>/dev/null && \
             jq -e --arg key "$BUILD_KEY" '
               .annotations["io.build-images.build-key"] == $key and
               ([.manifests[] | .platform | "\(.os)/\(.architecture)"] | sort == ["linux/amd64", "linux/arm64"])
             ' manifest.json; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    uses: ./.github/workflows/docker-release.yml
    with:
      project: dev-go
      check-command: python --version; go version; node --version; npm --version; task --version
      context: .
      version: ${{ needs.resolve.outputs.version }}
      build-args: ${{ needs.resolve.outputs.args }}
      build-key: ${{ needs.resolve.outputs.build_key }}
      publish: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
