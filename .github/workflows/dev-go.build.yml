name: Build dev-go

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "dev-go/**"
      - "common/**"
      - ".github/scripts/**"
      - ".github/workflows/dev-go.build.yml"
      - ".github/workflows/docker-release.yml"
  push:
    branches: [main]
    paths:
      - "dev-go/**"
      - "common/**"
      - ".github/scripts/**"
      - ".github/workflows/dev-go.build.yml"
      - ".github/workflows/docker-release.yml"
  schedule:
    - cron: "43 3 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-go-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
      args: ${{ steps.resolve.outputs.args }}
      build_key: ${{ steps.resolve.outputs.build_key }}
      node_version: ${{ steps.toolchains.outputs.node_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve current LTS toolchains
        id: toolchains
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/resolve-toolchains.sh
      - name: Check startup script syntax
        run: |
          find common -type f -name '*.sh' -print0 | xargs -0 -r -n 1 bash -n
          bash -n dev-go/entrypoint.sh
          docker compose -f dev-go/compose.sample.yml config --quiet
      - name: Resolve stable toolchain versions
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_VERSION: ${{ steps.toolchains.outputs.node_version }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 30 'https://go.dev/dl/?mode=json' > "$RUNNER_TEMP/go.json"
          GO_VERSION="$(jq -er '
            [.[] | select(.stable == true) | .version | ltrimstr("go")]
            | sort_by(split(".") | map(tonumber)) | last
          ' "$RUNNER_TEMP/go.json")"
          curl -fsSL --retry 3 --max-time 30 \
            'https://www.python.org/api/v2/downloads/release/?is_published=true&pre_release=false' > "$RUNNER_TEMP/python.json"
          PYTHON_VERSION="$(jq -er '
            [.[] | select(.is_published == true and .pre_release == false)
              | .name | sub("^Python "; "") | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))]
            | sort_by(split(".") | map(tonumber)) | last
          ' "$RUNNER_TEMP/python.json")"
          task_version="$(gh api repos/go-task/task/releases/latest --jq .tag_name)"
          for version in "$GO_VERSION" "$NODE_VERSION" "$PYTHON_VERSION" "${task_version#v}"; do
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          done
          build_key="$(
            {
              printf '%s\n' "$PYTHON_VERSION" "$GO_VERSION" "$NODE_VERSION" "$task_version"
              find common .github/scripts -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
              sha256sum dev-go/Dockerfile dev-go/entrypoint.sh \
                .github/workflows/dev-go.build.yml .github/workflows/docker-release.yml
            } | sha256sum | cut -d ' ' -f1
          )"
          {
            echo 'args<<BUILD_ARGS'
            echo "PYTHON_VERSION=$PYTHON_VERSION"
            echo "GO_VERSION=$GO_VERSION"
            echo "TASK_VERSION=$task_version"
            echo 'BUILD_ARGS'
            echo "version=go-$GO_VERSION"
            echo "build_key=$build_key"
            echo 'build=true'
          } >> "$GITHUB_OUTPUT"
          printf 'Resolved Go %s, Node %s, Python %s, Task %s\n' "$GO_VERSION" "$NODE_VERSION" "$PYTHON_VERSION" "$task_version"

  release:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    uses: ./.github/workflows/docker-release.yml
    with:
      project: dev-go
      check-numeric-user: true
      check-ssh-server: true
      check-command: |
        find /usr/local/lib/container-common -type f -name '*.sh' -print0 | xargs -0 -r -n 1 bash -n
        bash -n /usr/local/bin/entrypoint
        AGENT_CLIS=none CLI_UPDATE_INTERVAL=0 /usr/local/lib/container-common/entrypoint.sh sh -ec 'python --version; go version; node --version; npm --version; task --version'
      context: .
      version: ${{ needs.resolve.outputs.version }}
      build-args: |
        NODE_VERSION=${{ needs.resolve.outputs.node_version }}
        ${{ needs.resolve.outputs.args }}
      build-key: ${{ needs.resolve.outputs.build_key }}
      security-rebuild: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      record-build: true
      publish: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
