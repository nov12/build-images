name: Build dev-go

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "dev-go/**"
      - "common/**"
      - ".github/scripts/resolve-toolchains.sh"
      - ".github/workflows/dev-go.build.yml"
      - ".github/workflows/docker-release.yml"
  push:
    branches: [main]
    paths:
      - "dev-go/**"
      - "common/**"
      - ".github/scripts/resolve-toolchains.sh"
      - ".github/workflows/dev-go.build.yml"
      - ".github/workflows/docker-release.yml"
  schedule:
    - cron: "43 3 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-go-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
      args: ${{ steps.resolve.outputs.args }}
      build_key: ${{ steps.resolve.outputs.build_key }}
      node_version: ${{ steps.toolchains.outputs.node_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve current LTS toolchains
        id: toolchains
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash -n .github/scripts/resolve-toolchains.sh
          bash .github/scripts/resolve-toolchains.sh
      - name: Check startup script syntax
        run: |
          find common -type f -name '*.sh' -print0 | xargs -0 -r -n 1 bash -n
          bash -n dev-go/entrypoint.sh
          docker compose -f dev-go/compose.sample.yml config --quiet
      - name: Resolve stable toolchain versions
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_VERSION: ${{ steps.toolchains.outputs.node_version }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 30 'https://go.dev/dl/?mode=json' > "$RUNNER_TEMP/go.json"
          GO_VERSION="$(jq -er '
            [.[] | select(.stable == true) | .version | ltrimstr("go")]
            | sort_by(split(".") | map(tonumber)) | last
          ' "$RUNNER_TEMP/go.json")"
          curl -fsSL --retry 3 --max-time 30 \
            'https://www.python.org/api/v2/downloads/release/?is_published=true&pre_release=false' > "$RUNNER_TEMP/python.json"
          PYTHON_VERSION="$(jq -er '
            [.[] | select(.is_published == true and .pre_release == false)
              | .name | sub("^Python "; "") | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))]
            | sort_by(split(".") | map(tonumber)) | last
          ' "$RUNNER_TEMP/python.json")"
          task_version="$(gh api repos/go-task/task/releases/latest --jq .tag_name)"
          for version in "$GO_VERSION" "$NODE_VERSION" "$PYTHON_VERSION" "${task_version#v}"; do
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          done
          build_key="$(
            {
              printf '%s\n' "$PYTHON_VERSION" "$GO_VERSION" "$NODE_VERSION" "$task_version"
              find common -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
              sha256sum .github/scripts/resolve-toolchains.sh dev-go/Dockerfile dev-go/entrypoint.sh \
                .github/workflows/dev-go.build.yml .github/workflows/docker-release.yml
            } | sha256sum | cut -d ' ' -f1
          )"
          {
            echo 'args<<BUILD_ARGS'
            echo "PYTHON_VERSION=$PYTHON_VERSION"
            echo "GO_VERSION=$GO_VERSION"
            echo "TASK_VERSION=$task_version"
            echo 'BUILD_ARGS'
            echo "version=go-$GO_VERSION"
            echo "build_key=$build_key"
            echo 'build=true'
          } >> "$GITHUB_OUTPUT"
          printf 'Resolved Go %s, Node %s, Python %s, Task %s\n' "$GO_VERSION" "$NODE_VERSION" "$PYTHON_VERSION" "$task_version"

  release:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    uses: ./.github/workflows/docker-release.yml
    with:
      project: dev-go
      check-numeric-user: true
      numeric-user-mounts: |
        /home/apple
        /data
      check-ssh-server: true
      ssh-check-command: |
        container=''
        key="$RUNNER_TEMP/container-ssh-check"
        trap '[[ -z "$container" ]] || { docker logs "$container"; docker rm -f "$container"; }; rm -f "$key" "$key.pub"' EXIT
        ssh-keygen -q -t ed25519 -N "" -f "$key"
        public_key="$(cat "$key.pub")"
        for run_as in 0:0 666:666 12345:23456; do
          uid="${run_as%:*}" gid="${run_as#*:}"
          container="$(docker run -d --network none --user "$run_as" \
            --tmpfs "/home/apple:uid=$uid,gid=$gid,mode=700" \
            --tmpfs "/config:uid=$uid,gid=$gid,mode=700" \
            -e PUBLIC_KEY="$public_key" -e SSH_LISTEN_PORT=22222 \
            -e AGENT_CLIS=none -e EXTRA_TOOLS=none -e PYTHON_PACKAGES=none \
            -e CLI_UPDATE_INTERVAL=0 "$CHECK_IMAGE")"
          docker exec -i "$container" sh -c 'umask 077; cat > /tmp/client-key' < "$key"
          login_user="$(timeout 30s docker exec "$container" bash -ec '
            until (echo >/dev/tcp/127.0.0.1/22222) 2>/dev/null; do sleep 0.1; done
            ssh -F /dev/null -p 22222 -i /tmp/client-key \
              -o BatchMode=yes -o ConnectTimeout=5 \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              apple@127.0.0.1 '\''
                getent passwd "$(id -u)" >/dev/null
                ssh -G -F /dev/null example.invalid >/dev/null
                printf "%s:%s\n" "$(id -u)" "$(id -g)"
              '\''
          ')"
          expected_user="$run_as"
          if [[ "$run_as" == 0:0 ]]; then
            expected_user=666:666
            test "$(docker exec "$container" stat -c %u /config/ssh/ssh_host_ed25519_key)" = 0
          fi
          test "$login_user" = "$expected_user"
          docker rm -f "$container" >/dev/null
          container=''
        done
      check-command: |
        find /usr/local/lib/container-common -type f -name '*.sh' -print0 | xargs -0 -r -n 1 bash -n
        bash -n /usr/local/bin/entrypoint
        AGENT_CLIS=none CLI_UPDATE_INTERVAL=0 /usr/local/lib/container-common/entrypoint.sh sh -ec 'python --version; go version; node --version; npm --version; task --version'
      context: .
      version: ${{ needs.resolve.outputs.version }}
      build-args: |
        NODE_VERSION=${{ needs.resolve.outputs.node_version }}
        ${{ needs.resolve.outputs.args }}
      build-key: ${{ needs.resolve.outputs.build_key }}
      security-rebuild: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      record-build: true
      record-command: |
        node --version
        npm --version
        python --version
        task --version
        go version
        find /usr/local/share/build-images -type f -print -exec cat {} \;
        dpkg-query -W
      publish: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
