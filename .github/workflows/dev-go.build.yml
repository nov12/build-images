name: dev-go / build

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "dev-go/**"
      - ".github/workflows/dev-go.build.yml"

concurrency:
  group: dev-go-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/nov12/dev-go

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-26.04

    outputs:
      python: ${{ steps.versions.outputs.python }}
      go: ${{ steps.versions.outputs.go }}
      node: ${{ steps.versions.outputs.node }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Load versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          source dev-go/versions.env

          {
            echo "python=${PYTHON_VERSION}"
            echo "go=${GO_VERSION}"
            echo "node=${NODE_VERSION}"
          } >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: prepare
    runs-on: ubuntu-26.04

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64
        id: build
        uses: docker/build-push-action@v7
        with:
          context: dev-go
          platforms: linux/amd64

          build-args: |
            PYTHON_VERSION=${{ needs.prepare.outputs.python }}
            GO_VERSION=${{ needs.prepare.outputs.go }}
            NODE_VERSION=${{ needs.prepare.outputs.node }}

          outputs: |
            type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

          provenance: false

  build-arm64:
    needs: prepare
    runs-on: ubuntu-26.04-arm

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build arm64
        id: build
        uses: docker/build-push-action@v7
        with:
          context: dev-go
          platforms: linux/arm64

          build-args: |
            PYTHON_VERSION=${{ needs.prepare.outputs.python }}
            GO_VERSION=${{ needs.prepare.outputs.go }}
            NODE_VERSION=${{ needs.prepare.outputs.node }}

          outputs: |
            type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

          provenance: false

  merge:
    needs:
      - prepare
      - build-amd64
      - build-arm64

    runs-on: ubuntu-26.04

    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest
        shell: bash
        env:
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
          GO_VERSION: ${{ needs.prepare.outputs.go }}
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:go-${GO_VERSION}" \
            "${IMAGE}@${AMD64_DIGEST}" \
            "${IMAGE}@${ARM64_DIGEST}"

      - name: Inspect
        run: |
          docker buildx imagetools inspect "${IMAGE}:latest"