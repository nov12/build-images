name: Build and publish Docker images

on:
  workflow_call:
    inputs:
      project:
        type: string
        required: true
      version:
        type: string
        required: true
      # 只检查容器内命令或模块能否运行，不测试上游业务接口
      check-command:
        type: string
        required: true
      check-numeric-user:
        type: boolean
        default: false
      check-ssh-server:
        type: boolean
        default: false
      check-startup:
        type: boolean
        default: false
      security-rebuild:
        type: boolean
        default: false
      record-build:
        type: boolean
        default: false
      upstream-revision:
        type: string
        default: ""
      # 默认使用项目目录，需要复用其他目录文件时传入 .
      context:
        type: string
        default: ""
      # 按 <名称>-<架构> 下载预构建产物到 ./_build
      build-artifact:
        type: string
        default: ""
      build-contexts:
        type: string
        default: ""
      build-args:
        type: string
        default: ""
      build-key:
        type: string
        default: ""
      roles:
        type: string
        default: '[""]'
      upstream-repository:
        type: string
        default: ""
      upstream-version-prefix:
        type: string
        default: ""
      publish:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # 每种架构独立构建和检查，通过后仅推送不可变摘要
  build:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        role: ${{ fromJSON(inputs.roles) }}
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check version resolver syntax
        if: inputs.record-build
        run: bash -n .github/scripts/resolve-toolchains.sh
      - name: Check runtime preparation syntax
        if: inputs.record-build && inputs.project == 'paperclip'
        run: node --check paperclip/prepare-runtime.mjs
      - name: Download build artifact
        if: inputs.build-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.build-artifact }}-${{ matrix.arch }}
          path: _build
      - name: Install image transport
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends skopeo
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build local OCI image
        id: image
        uses: docker/build-push-action@v7
        env:
          BUILDX_METADATA_PROVENANCE: ${{ inputs.record-build && 'max' || 'min' }}
        with:
          context: ${{ inputs.context || format('./{0}', inputs.project) }}
          file: ./${{ inputs.project }}/Dockerfile
          target: ${{ matrix.role }}
          platforms: linux/${{ matrix.arch }}
          build-contexts: ${{ inputs.build-contexts }}
          build-args: ${{ inputs.build-args }}
          pull: true
          no-cache-filters: ${{ inputs.security-rebuild && 'runtime-system' || '' }}
          provenance: false
          sbom: false
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
            ${{ inputs.upstream-revision != '' && format('io.build-images.upstream-revision={0}', inputs.upstream-revision) || '' }}
          cache-from: type=gha,scope=${{ inputs.project }}-${{ matrix.role }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.project }}-${{ matrix.role }}-${{ matrix.arch }}
      - name: Load local image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          skopeo copy "oci-archive:$RUNNER_TEMP/image.tar" docker-daemon:local/build:check
          test "$(docker image inspect local/build:check --format '{{.Os}}/{{.Architecture}}')" = "linux/$ARCH"
      - name: Check runtime
        env:
          CHECK_COMMAND: ${{ inputs.check-command }}
        run: |
          set -euo pipefail
          # 跳过应用入口，避免安装 Agent CLI 或启动外部连接
          docker run --rm --network none --entrypoint /usr/bin/env local/build:check -u LD_PRELOAD sh -ec "$CHECK_COMMAND"
      - name: Check numeric users
        if: inputs.check-numeric-user
        env:
          CHECK_COMMAND: ${{ inputs.check-command }}
        run: |
          set -euo pipefail
          container=''
          trap '[[ -z "$container" ]] || { docker logs "$container"; docker rm -f "$container"; }' EXIT
          default_user="$(docker run --rm --entrypoint /usr/bin/env local/build:check -u LD_PRELOAD sh -c 'printf "%s:%s" "$(id -u)" "$(id -g)"')"
          for run_as in "$default_user" 12345:23456 23456:12345; do
            uid="${run_as%:*}" gid="${run_as#*:}"
            # 使用当前用户可写的临时目录，不修改持久卷属主。
            container="$(docker run -d --network none --user "$run_as" --group-add 34567 \
              --tmpfs "/home/node:uid=$uid,gid=$gid,mode=700" \
              --tmpfs "/home/apple:uid=$uid,gid=$gid,mode=700" \
              --tmpfs "/opt/agent-cli:uid=$uid,gid=$gid,mode=700" \
              --tmpfs "/data:uid=$uid,gid=$gid,mode=700" \
              -e AGENT_CLIS=none -e EXTRA_TOOLS=none -e PYTHON_PACKAGES=none \
              -e PASEO_PLUGINS=none -e CLI_UPDATE_INTERVAL=0 -e CHECK_COMMAND \
              -e EXPECTED_UID="$uid" -e EXPECTED_GID="$gid" local/build:check bash -ec '
                test "$(id -u)" = "$EXPECTED_UID"
                test "$(id -g)" = "$EXPECTED_GID"
                getent group 34567 >/dev/null
                ssh -G -F /dev/null example.invalid >/dev/null
                node -e "const a=require(\"node:assert/strict\"),u=require(\"node:os\").userInfo();a.equal(u.uid,process.getuid());a.equal(u.gid,process.getgid());a.equal(u.homedir,process.env.HOME)"
                git config --global user.name "Container check"
                bash -ec "$CHECK_COMMAND"
                touch /tmp/container-user/ready
                exec sleep infinity
              ')"
            # docker exec 使用容器环境，验证它也能查询入口准备的用户。
            # shellcheck disable=SC2016
            timeout 30s docker exec "$container" bash -ec '
              until [[ -e /tmp/container-user/ready ]]; do sleep 0.1; done
              getent passwd "$(id -u)" >/dev/null
              getent group "$(id -g)" >/dev/null
              ssh -G -F /dev/null example.invalid >/dev/null
            '
            docker rm -f "$container" >/dev/null
            container=''
          done
      - name: Check offline service startup and shutdown
        if: inputs.check-startup
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          project="$PROJECT"
          image=local/build:check
          startup_timeout=240
          case "$project" in
            aionui) port=25808; health=/api/auth/status ;;
            paseo) port=6767; health=/ ;;
            paperclip) port=3100; health=/api/health; startup_timeout=600 ;;
            *) printf 'Unsupported startup check: %s\n' "$project" >&2; exit 1 ;;
          esac

          container=''
          cleanup() {
            if [[ -n "$container" ]]; then
              docker logs "$container"
              docker rm -f "$container" >/dev/null
            fi
          }
          trap cleanup EXIT
          container="$(docker run -d --network none \
            -e AGENT_CLIS=none -e EXTRA_TOOLS=none -e PYTHON_PACKAGES=none \
            -e PASEO_PLUGINS=none -e PASEO_PASSWORD=offline-startup-check \
            -e CLI_UPDATE_INTERVAL=0 -e PAPERCLIP_DEPLOYMENT_MODE=authenticated \
            -e BETTER_AUTH_SECRET="$(openssl rand -hex 32)" \
            -e PAPERCLIP_TOOL_ACTION_SIGNING_SECRET="$(openssl rand -hex 32)" \
            -e PAPERCLIP_DEPLOYMENT_EXPOSURE=private "$image")"
          deadline=$((SECONDS + startup_timeout))
          until docker exec -e CHECK_PORT="$port" -e CHECK_HEALTH="$health" -e CHECK_PROJECT="$project" \
            "$container" /usr/local/bin/node --input-type=module -e '
              const response = await fetch(`http://127.0.0.1:${process.env.CHECK_PORT}${process.env.CHECK_HEALTH}`, { signal: AbortSignal.timeout(4000) });
              if (!response.ok) process.exit(1);
              if (process.env.CHECK_PROJECT === "paperclip" && (await response.json()).status !== "ok") process.exit(1);
            ' 2>/dev/null; do
            test "$(docker inspect --format '{{.State.Running}}' "$container")" = true
            if (( SECONDS >= deadline )); then printf 'Startup timed out\n' >&2; exit 1; fi
            sleep 2
          done
          docker exec -e CHECK_PORT="$port" "$container" /usr/local/bin/node --input-type=module -e '
            const response = await fetch(`http://127.0.0.1:${process.env.CHECK_PORT}/`, { signal: AbortSignal.timeout(4000) });
            if (!response.ok || !(await response.text()).toLowerCase().includes("<html")) throw new Error("Missing Web UI");
          '
          if [[ "$project" == paseo ]]; then
            docker exec "$container" /usr/local/bin/node --input-type=module -e '
              import { createRequire } from "node:module";
              const require = createRequire("/opt/paseo/node_modules/@getpaseo/server/package.json");
              const terminal = require("node-pty").spawn("/bin/sh", ["-c", "printf native-pty-ready"], { name: "xterm", cols: 80, rows: 24 });
              let output = "";
              const timer = setTimeout(() => { terminal.kill(); process.exit(1); }, 10000);
              terminal.onData(data => { output += data; });
              terminal.onExit(({ exitCode }) => { clearTimeout(timer); if (exitCode !== 0 || !output.includes("native-pty-ready")) process.exit(1); });
            '
          fi
          if [[ "$project" == aionui ]]; then
            docker exec "$container" bash -ec '
              cache_version="$(cat /usr/local/share/aionui/managed-node-version)"
              architecture="$(/usr/local/bin/node -p process.arch)"
              actual="$(/usr/local/bin/node -p process.versions.node)"
              runtime="${AIONUI_DATA_DIR:-$HOME/.aionui-web}/runtime/node/node-v$cache_version-linux-$architecture"
              test -L "$runtime"
              test "$("$runtime/bin/node" -p process.versions.node)" = "$actual"
              "$runtime/bin/npm" --version
              "$runtime/bin/npx" --version
            '
            deadline=$((SECONDS + 60))
            until docker logs "$container" 2>&1 | grep -F 'managed runtime background preparation completed' >/dev/null; do
              test "$(docker inspect --format '{{.State.Running}}' "$container")" = true
              if (( SECONDS >= deadline )); then printf 'AionCore managed Node validation timed out\n' >&2; exit 1; fi
              sleep 1
            done
          fi
          docker stop --time 60 "$container" >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" != 137
      - name: Check SSH server
        if: inputs.check-ssh-server
        run: |
          set -euo pipefail
          container=''
          key="$RUNNER_TEMP/container-ssh-check"
          trap '[[ -z "$container" ]] || { docker logs "$container"; docker rm -f "$container"; }; rm -f "$key" "$key.pub"' EXIT
          ssh-keygen -q -t ed25519 -N "" -f "$key"
          public_key="$(cat "$key.pub")"
          for run_as in 0:0 666:666 12345:23456; do
            uid="${run_as%:*}" gid="${run_as#*:}"
            container="$(docker run -d --network none --user "$run_as" \
              --tmpfs "/home/apple:uid=$uid,gid=$gid,mode=700" \
              --tmpfs "/config:uid=$uid,gid=$gid,mode=700" \
              --tmpfs "/opt/agent-cli:uid=$uid,gid=$gid,mode=700" \
              -e PUBLIC_KEY="$public_key" -e SSH_LISTEN_PORT=22222 \
              -e AGENT_CLIS=none -e EXTRA_TOOLS=none -e PYTHON_PACKAGES=none \
              -e CLI_UPDATE_INTERVAL=0 local/build:check)"
            docker exec -i "$container" sh -c 'umask 077; cat > /tmp/client-key' < "$key"
            # shellcheck disable=SC2016
            login_user="$(timeout 30s docker exec "$container" bash -ec '
              until (echo >/dev/tcp/127.0.0.1/22222) 2>/dev/null; do sleep 0.1; done
              ssh -F /dev/null -p 22222 -i /tmp/client-key \
                -o BatchMode=yes -o ConnectTimeout=5 \
                -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                apple@127.0.0.1 '\''
                  getent passwd "$(id -u)" >/dev/null
                  ssh -G -F /dev/null example.invalid >/dev/null
                  printf "%s:%s\n" "$(id -u)" "$(id -g)"
                '\''
            ')"
            expected_user="$run_as"
            if [[ "$run_as" == 0:0 ]]; then
              expected_user=666:666
              test "$(docker exec "$container" stat -c %u /config/ssh/ssh_host_ed25519_key)" = 0
            fi
            test "$login_user" = "$expected_user"
            docker rm -f "$container" >/dev/null
            container=''
          done
      - name: Record resolved build and runtime
        if: inputs.record-build
        env:
          BUILD_ARGS: ${{ inputs.build-args }}
          BUILD_DIGEST: ${{ steps.image.outputs.digest }}
          UPSTREAM_REVISION: ${{ inputs.upstream-revision }}
          SECURITY_REBUILD: ${{ inputs.security-rebuild }}
        run: |
          set -euo pipefail
          mkdir -p _build-record
          [[ "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$BUILD_ARGS" > _build-record/build-args.txt
          printf '{"containerimage.digest":"%s"}\n' "$BUILD_DIGEST" > _build-record/buildkit.json
          printf 'repository=%s\ncommit=%s\nupstream_commit=%s\nrun=%s\nsecurity_rebuild=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$UPSTREAM_REVISION" "$GITHUB_RUN_ID" "$SECURITY_REBUILD" > _build-record/source.txt
          docker image inspect local/build:check > _build-record/image.json
          docker run --rm --network none --entrypoint /usr/bin/env local/build:check -u LD_PRELOAD sh -ec '
            node --version; npm --version
            if test -d /app; then cd /app; fi
            for tool in bun corepack pnpm python task; do
              if command -v "$tool" >/dev/null; then "$tool" --version; fi
            done
            if command -v go >/dev/null; then go version; fi
            if test -f /app/.build/runtime.json; then cat /app/.build/runtime.json; fi
            if test -f /opt/paperclip-runner/provider-pack/provider-pack.json; then cat /opt/paperclip-runner/provider-pack/provider-pack.json; fi
            if test -f /opt/paseo/package-lock.json; then sha256sum /opt/paseo/package-lock.json; fi
            for binary in /usr/local/bin/bun /usr/local/bin/aioncore /opt/t3/t3; do
              if test -f "$binary"; then sha256sum "$binary"; fi
            done
            if test -d /usr/local/share/build-images; then find /usr/local/share/build-images -type f -print -exec cat {} \;; fi
            dpkg-query -W
          ' > _build-record/runtime.txt
          sha256sum _build-record/* > _build-record/SHA256SUMS
          printf 'Verified image size (uncompressed bytes): %s\n' \
            "$(docker image inspect local/build:check --format '{{.Size}}')" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build record
        if: inputs.record-build
        uses: actions/upload-artifact@v7
        with:
          name: build-record-${{ inputs.project }}-${{ matrix.role }}-${{ matrix.arch }}-${{ github.run_id }}
          path: _build-record/
          if-no-files-found: error
          retention-days: 90
      # 推送本地已检查的 OCI 产物，不重新构建，也不跨 job 搬运镜像
      - name: Push checked image by digest
        if: inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ inputs.project }}
          ROLE: ${{ matrix.role }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$PROJECT${ROLE:+-$ROLE}"
          skopeo inspect --raw "oci-archive:$RUNNER_TEMP/image.tar" > "$RUNNER_TEMP/manifest.json"
          digest="sha256:$(sha256sum "$RUNNER_TEMP/manifest.json" | cut -d ' ' -f1)"
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$RUNNER_TEMP/auth.json" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          trap 'rm -f "$RUNNER_TEMP/auth.json"' EXIT
          skopeo copy --authfile "$RUNNER_TEMP/auth.json" --preserve-digests \
            "oci-archive:$RUNNER_TEMP/image.tar" "docker://$image@$digest"
          skopeo inspect --authfile "$RUNNER_TEMP/auth.json" --raw "docker://$image@$digest" > "$RUNNER_TEMP/remote.json"
          test "sha256:$(sha256sum "$RUNNER_TEMP/remote.json" | cut -d ' ' -f1)" = "$digest"
          mkdir -p _digests
          printf '%s\n' "$digest" > "_digests/$PROJECT${ROLE:+-$ROLE}-$ARCH.txt"
          printf '%s%s (%s): %s\n' "$PROJECT" "${ROLE:+-$ROLE}" "$ARCH" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified digest
        if: inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ inputs.project }}-${{ matrix.role }}-${{ matrix.arch }}
          path: _digests/*
          if-no-files-found: error
          retention-days: 1

  # 全部架构检查通过后，合并版本标签，再更新 latest
  publish:
    needs: build
    if: inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJSON(inputs.roles) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download verified digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ inputs.project }}-${{ matrix.role }}-*
          path: _digests
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish version and verify before updating latest
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ inputs.project }}
          ROLE: ${{ matrix.role }}
          VERSION: ${{ inputs.version }}
          BUILD_KEY: ${{ inputs.build-key }}
          UPSTREAM_REPOSITORY: ${{ inputs.upstream-repository }}
          UPSTREAM_VERSION_PREFIX: ${{ inputs.upstream-version-prefix }}
          RECORD_BUILD: ${{ inputs.record-build }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$PROJECT${ROLE:+-$ROLE}"
          refs=()
          for arch in amd64 arm64; do
            digest="$(cat "_digests/$PROJECT${ROLE:+-$ROLE}-$arch.txt")"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            refs+=("$image@$digest")
          done
          annotations=()
          if [[ -n "$BUILD_KEY" ]]; then
            annotations+=(--annotation "index:io.build-images.build-key=$BUILD_KEY")
          fi
          if [[ "$RECORD_BUILD" == true ]]; then
            annotations+=(--annotation "index:io.build-images.build-run=$GITHUB_RUN_ID")
          fi
          docker buildx imagetools create "${annotations[@]}" --tag "$image:$VERSION" "${refs[@]}"
          docker buildx imagetools inspect "$image:$VERSION" --raw > manifest.json
          jq -e '[.manifests[] | .platform | "\(.os)/\(.architecture)"] | sort == ["linux/amd64", "linux/arm64"]' manifest.json
          for arch in amd64 arm64; do
            expected="$(cat "_digests/$PROJECT${ROLE:+-$ROLE}-$arch.txt")"
            jq -e --arg arch "$arch" --arg digest "$expected" '.manifests[] | select(.platform.architecture == $arch) | .digest == $digest' manifest.json
          done
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/${{ github.event.repository.default_branch }}" --jq .sha)"
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo '::notice::Default branch advanced; preserving latest'
            exit 0
          fi
          if [[ -n "$UPSTREAM_REPOSITORY" ]]; then
            current="$(gh api "repos/$UPSTREAM_REPOSITORY/releases/latest" --jq .tag_name)"
            test "${UPSTREAM_VERSION_PREFIX}${current#v}" = "$VERSION"
          fi
          manifest_digest="sha256:$(sha256sum manifest.json | cut -d ' ' -f1)"
          docker buildx imagetools create --tag "$image:latest" "$image@$manifest_digest"
          docker buildx imagetools inspect "$image:latest" --raw > latest.json
          cmp manifest.json latest.json
          printf 'Published %s:%s and latest: %s\n' "$image" "$VERSION" "$manifest_digest" >> "$GITHUB_STEP_SUMMARY"
