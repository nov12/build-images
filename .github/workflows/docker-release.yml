name: Build and publish Docker images

on:
  workflow_call:
    inputs:
      project:
        type: string
        required: true
      version:
        type: string
        required: true
      # 只检查容器内命令或模块能否运行，不测试上游业务接口
      check-command:
        type: string
        required: true
      # 默认使用项目目录，需要复用其他目录文件时传入 .
      context:
        type: string
        default: ""
      # 按 <名称>-<架构> 下载预构建产物到 ./_build
      build-artifact:
        type: string
        default: ""
      build-contexts:
        type: string
        default: ""
      build-args:
        type: string
        default: ""
      build-key:
        type: string
        default: ""
      roles:
        type: string
        default: '[""]'
      upstream-repository:
        type: string
        default: ""
      upstream-version-prefix:
        type: string
        default: ""
      publish:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # 每种架构独立构建和检查，通过后仅推送不可变摘要
  build:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        role: ${{ fromJSON(inputs.roles) }}
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download build artifact
        if: inputs.build-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.build-artifact }}-${{ matrix.arch }}
          path: _build
      - name: Install image transport
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends skopeo
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build local OCI image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context || format('./{0}', inputs.project) }}
          file: ./${{ inputs.project }}/Dockerfile
          target: ${{ matrix.role }}
          platforms: linux/${{ matrix.arch }}
          build-contexts: ${{ inputs.build-contexts }}
          build-args: ${{ inputs.build-args }}
          pull: true
          provenance: false
          sbom: false
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          cache-from: type=gha,scope=${{ inputs.project }}-${{ matrix.role }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.project }}-${{ matrix.role }}-${{ matrix.arch }}
      - name: Load local image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          skopeo copy "oci-archive:$RUNNER_TEMP/image.tar" docker-daemon:local/build:check
          test "$(docker image inspect local/build:check --format '{{.Os}}/{{.Architecture}}')" = "linux/$ARCH"
      - name: Check runtime
        env:
          CHECK_COMMAND: ${{ inputs.check-command }}
        run: |
          set -euo pipefail
          # 跳过应用入口，避免安装 Agent CLI 或启动外部连接
          docker run --rm --network none --entrypoint sh local/build:check -ec "$CHECK_COMMAND"
      # 推送本地已检查的 OCI 产物，不重新构建，也不跨 job 搬运镜像
      - name: Push checked image by digest
        if: inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ inputs.project }}
          ROLE: ${{ matrix.role }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$PROJECT${ROLE:+-$ROLE}"
          skopeo inspect --raw "oci-archive:$RUNNER_TEMP/image.tar" > "$RUNNER_TEMP/manifest.json"
          digest="sha256:$(sha256sum "$RUNNER_TEMP/manifest.json" | cut -d ' ' -f1)"
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$RUNNER_TEMP/auth.json" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          trap 'rm -f "$RUNNER_TEMP/auth.json"' EXIT
          skopeo copy --authfile "$RUNNER_TEMP/auth.json" --preserve-digests \
            "oci-archive:$RUNNER_TEMP/image.tar" "docker://$image@$digest"
          skopeo inspect --authfile "$RUNNER_TEMP/auth.json" --raw "docker://$image@$digest" > "$RUNNER_TEMP/remote.json"
          test "sha256:$(sha256sum "$RUNNER_TEMP/remote.json" | cut -d ' ' -f1)" = "$digest"
          mkdir -p _digests
          printf '%s\n' "$digest" > "_digests/$PROJECT${ROLE:+-$ROLE}-$ARCH.txt"
          printf '%s%s (%s): %s\n' "$PROJECT" "${ROLE:+-$ROLE}" "$ARCH" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified digest
        if: inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ inputs.project }}-${{ matrix.role }}-${{ matrix.arch }}
          path: _digests/*
          if-no-files-found: error
          retention-days: 1

  # 全部架构检查通过后，合并版本标签，再更新 latest
  publish:
    needs: build
    if: inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJSON(inputs.roles) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download verified digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ inputs.project }}-${{ matrix.role }}-*
          path: _digests
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish version and verify before updating latest
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ inputs.project }}
          ROLE: ${{ matrix.role }}
          VERSION: ${{ inputs.version }}
          BUILD_KEY: ${{ inputs.build-key }}
          UPSTREAM_REPOSITORY: ${{ inputs.upstream-repository }}
          UPSTREAM_VERSION_PREFIX: ${{ inputs.upstream-version-prefix }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$PROJECT${ROLE:+-$ROLE}"
          refs=()
          for arch in amd64 arm64; do
            digest="$(cat "_digests/$PROJECT${ROLE:+-$ROLE}-$arch.txt")"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            refs+=("$image@$digest")
          done
          annotations=()
          if [[ -n "$BUILD_KEY" ]]; then
            annotations+=(--annotation "index:io.build-images.build-key=$BUILD_KEY")
          fi
          docker buildx imagetools create "${annotations[@]}" --tag "$image:$VERSION" "${refs[@]}"
          docker buildx imagetools inspect "$image:$VERSION" --raw > manifest.json
          jq -e '[.manifests[] | .platform | "\(.os)/\(.architecture)"] | sort == ["linux/amd64", "linux/arm64"]' manifest.json
          for arch in amd64 arm64; do
            expected="$(cat "_digests/$PROJECT${ROLE:+-$ROLE}-$arch.txt")"
            jq -e --arg arch "$arch" --arg digest "$expected" '.manifests[] | select(.platform.architecture == $arch) | .digest == $digest' manifest.json
          done
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/${{ github.event.repository.default_branch }}" --jq .sha)"
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo '::notice::Default branch advanced; preserving latest'
            exit 0
          fi
          if [[ -n "$UPSTREAM_REPOSITORY" ]]; then
            current="$(gh api "repos/$UPSTREAM_REPOSITORY/releases/latest" --jq .tag_name)"
            test "${UPSTREAM_VERSION_PREFIX}${current#v}" = "$VERSION"
          fi
          manifest_digest="sha256:$(sha256sum manifest.json | cut -d ' ' -f1)"
          docker buildx imagetools create --tag "$image:latest" "$image@$manifest_digest"
          docker buildx imagetools inspect "$image:latest" --raw > latest.json
          cmp manifest.json latest.json
          printf 'Published %s:%s and latest: %s\n' "$image" "$VERSION" "$manifest_digest" >> "$GITHUB_STEP_SUMMARY"
