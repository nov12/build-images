# SSH starts as root; default login user UID:GID is 666:666.

services:
  dev-go:
    image: ghcr.io/nov12/dev-go:latest
    pull_policy: always
    container_name: dev-go
    restart: unless-stopped

    # Host SSH port; container port is 22.
    ports:
      - "${SSH_PORT:-2222}:22"

    environment:
      # SSH login username.
      USER_NAME: "${USER_NAME:-apple}"

      # Timezone.
      TZ: "${TZ:-Asia/Singapore}"

      # SSH public key; nonempty replaces authorized_keys.
      PUBLIC_KEY: "${PUBLIC_KEY:-}"

      # SSH password login: true | false
      PASSWORD_ACCESS: "${PASSWORD_ACCESS:-false}"

      # Password when PASSWORD_ACCESS=true.
      USER_PASSWORD: "${USER_PASSWORD:-}"

      # Passwordless sudo: true | false
      SUDO_ACCESS: "${SUDO_ACCESS:-false}"

      # codex,claude,opencode,gemini,qwen,kimi,copilot,pi,cline,amp,agy | all | none (name@version except agy)
      AGENT_CLIS: "${AGENT_CLIS-codex,claude,opencode}"

      # Update interval in seconds; 0 = startup only.
      CLI_UPDATE_INTERVAL: "${CLI_UPDATE_INTERVAL:-86400}"

      # skip | update | overwrite
      CLI_INSTALL_MODE: "${CLI_INSTALL_MODE:-update}"

      # go,dotnet,python,uv,rust,node,bun,deno,java | none (supports name@version)
      EXTRA_TOOLS: "${EXTRA_TOOLS-}"

      # Comma-separated Python packages, e.g. requests,ruff (auto-enables python).
      PYTHON_PACKAGES: "${PYTHON_PACKAGES-}"

      # skip | update | overwrite
      TOOLS_INSTALL_MODE: "${TOOLS_INSTALL_MODE:-update}"

      # Startup check interval in seconds; 0 = reuse.
      TOOLS_UPDATE_INTERVAL: "${TOOLS_UPDATE_INTERVAL:-86400}"

      # Startup installer proxy URLs.
      # HTTP_PROXY: "${HTTP_PROXY:-}"
      # HTTPS_PROXY: "${HTTPS_PROXY:-}"
      # ALL_PROXY: "${ALL_PROXY:-}"
      # NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,::1}"

    volumes:
      # SSH host keys.
      - dev-go-config:/config

      # Login user home, CLI logins, and tools.
      - dev-go-home:/home/${USER_NAME:-apple}

      # Project workspace.
      - ./workspace:/workspace

      # Go binaries and module cache.
      - go-data:/go

      # Shared CLI/tool mounts across containers.
      # - /srv/shared/agent-cli:/home/${USER_NAME:-apple}/agent-cli
      # - /srv/shared/extra-tools:/home/${USER_NAME:-apple}/extra-tools
      # - /srv/shared/pythonlib:/home/${USER_NAME:-apple}/pythonlib
      # - /srv/shared/uvenvs:/home/${USER_NAME:-apple}/uvenvs

volumes:
  dev-go-config:
  dev-go-home:
  go-data:
