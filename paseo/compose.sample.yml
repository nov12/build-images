# Uncomment optional blocks; ${...} reads shell/.env values.
# App settings: /home/node/.paseo/config.json.

services:
  paseo:
    image: ghcr.io/nov12/paseo:latest
    pull_policy: always
    container_name: paseo
    restart: unless-stopped

    # UID:GID; mounted directories must be writable.

    user: "${PUID:-666}:${PGID:-666}"

    # Proxies must preserve Host and forward WebSockets.

    ports:
      - "6767:6767"

    environment:

      # Required daemon password.

      PASEO_PASSWORD: "${PASEO_PASSWORD:?Set PASEO_PASSWORD in shell or .env}"

      # Extra allowed domains, comma-separated; IPs/localhost are already allowed.

      PASEO_HOSTNAMES: "${PASEO_HOSTNAMES:-}"

      # Proxy trust: source IPs/CIDRs. CORS: comma-separated origins.

      # PASEO_TRUSTED_PROXIES: "${PASEO_TRUSTED_PROXIES:?Set proxy source IPs or CIDRs}"
      # PASEO_CORS_ORIGINS: "${PASEO_CORS_ORIGINS:?Set extra origins}"

      # Relay: true/false; commented = saved setting.

      # PASEO_RELAY_ENABLED: "${PASEO_RELAY_ENABLED:-false}"

      # Logs: info = normal, debug = verbose.
      # Rotation: size limit and file count; config.json takes priority.

      # PASEO_LOG_LEVEL: "${PASEO_LOG_LEVEL:-info}"
      # PASEO_LOG_ROTATE_SIZE: "${PASEO_LOG_ROTATE_SIZE:-10m}"
      # PASEO_LOG_ROTATE_COUNT: "${PASEO_LOG_ROTATE_COUNT:-3}"

      # Plugin sources, comma-separated; none/empty skips installation.
      # Installed versions/states are kept; removing a source does not uninstall.

      PASEO_PLUGINS: "${PASEO_PLUGINS-siyxo511/git-graph,casonmo/agent-usage}"

      # Optional plugin registry URL.

      # PASEO_PLUGIN_REGISTRY: "${PASEO_PLUGIN_REGISTRY:-https://plugins.paseo.sh}"

      # Voice features: true = on, false = off.

      # PASEO_DICTATION_ENABLED: "${PASEO_DICTATION_ENABLED:-true}"
      # PASEO_VOICE_MODE_ENABLED: "${PASEO_VOICE_MODE_ENABLED:-false}"

      # CLIs: codex,claude,opencode,gemini,qwen,kimi,copilot,pi,cline,amp,agy (Antigravity).
      # Select: comma-separated names or all; none/empty = off; name@version except agy.
      # Auto-update: 86400 = every 24h; 0 = startup only (seconds).
      # Mode: skip = reuse/no auto-update; update = auto-update; overwrite = reinstall.

      AGENT_CLIS: "${AGENT_CLIS-codex,claude,opencode,pi,kimi}"
      CLI_UPDATE_INTERVAL: "${CLI_UPDATE_INTERVAL:-86400}"
      CLI_INSTALL_MODE: "${CLI_INSTALL_MODE:-update}"

      # Tools: go,dotnet,python,uv,rust,node,bun,deno,java; name@version; none/empty = off.
      # Python packages: e.g. requests,ruff; Python is enabled automatically.
      # Mode: skip = reuse; update = check; overwrite = reinstall.
      # Checks: startup only (seconds); 0 = reuse; overwrite ignores the interval.

      EXTRA_TOOLS: "${EXTRA_TOOLS-}"
      PYTHON_PACKAGES: "${PYTHON_PACKAGES-}"
      TOOLS_INSTALL_MODE: "${TOOLS_INSTALL_MODE:-update}"
      TOOLS_UPDATE_INTERVAL: "${TOOLS_UPDATE_INTERVAL:-86400}"

      # Optional proxy URLs reachable from the container; client support varies.

      # HTTP_PROXY: "${HTTP_PROXY:-}"
      # HTTPS_PROXY: "${HTTPS_PROXY:-}"
      # ALL_PROXY: "${ALL_PROXY:-}"
      # NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,::1}"

      # Optional provider API keys; CLI login also works.

      # OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      # GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"

    # Home: Paseo state, plugins, CLI logins and tools. Workspace: projects.
    # Shared mounts need compatible paths/runtimes; CLI entries are shared.

    volumes:
      - paseo-home:/home/node
      - ./workspace:/workspace

      # - /srv/shared/agent-cli:/home/node/agent-cli
      # - /srv/shared/extra-tools:/home/node/extra-tools
      # - /srv/shared/pythonlib:/home/node/pythonlib
      # - /srv/shared/uvenvs:/home/node/uvenvs

volumes:
  paseo-home:
