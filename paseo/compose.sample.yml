services:
  paseo:
    image: ghcr.io/nov12/paseo:latest
    container_name: paseo
    restart: unless-stopped

    user: "${PUID:-1000}:${PGID:-1000}"

    ports:
      - "6767:6767"

    environment:
      # Set a strong password in .env before starting; required for remote access
      PASEO_PASSWORD: "${PASEO_PASSWORD:?Set PASEO_PASSWORD in .env before starting Paseo}"

      # Add DNS names used to reach Paseo; IPs and localhost are allowed by default
      # PASEO_HOSTNAMES: "paseo.example.com,.lan"

      # Optional: disable the public relay when using direct connections only
      # PASEO_RELAY_ENABLED: "false"

      # Available CLIs: codex,claude,opencode,gemini,qwen,kimi,copilot,pi,cline,amp
      # all = install all; none or empty string = install none
      AGENT_CLIS: "codex,claude,opencode,pi,kimi"

      # Update interval in seconds; 0 disables periodic checks
      # Updates are postponed while the corresponding Agent is running
      CLI_UPDATE_INTERVAL: "86400"

    volumes:
      # Daemon state, user configuration and Agent authentication
      - paseo-home:/home/node

      # Installed Agent CLIs; avoid concurrent updates when sharing this volume
      - agent-cli:/opt/agent-cli

      # Project workspace
      - ./workspace:/workspace

volumes:
  paseo-home:
  agent-cli:
