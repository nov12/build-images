services:
  paseo:
    image: ghcr.io/nov12/paseo:latest
    container_name: paseo
    restart: unless-stopped

    user: "${PUID:-1000}:${PGID:-1000}"

    ports:
      - "6767:6767"

    environment:
      # Set a strong password in .env before starting; required for remote access
      PASEO_PASSWORD: "${PASEO_PASSWORD:?Set PASEO_PASSWORD in .env before starting Paseo}"

      # Required for DNS/reverse proxy access; missing names cause 403 Invalid Host header
      # Replace these official example names with your own comma-separated DNS names
      # IPs and localhost are also allowed by default
      PASEO_HOSTNAMES: "paseo.example.com,.lan"

      # Reverse proxy: use HTTPS outside localhost and forward WebSocket upgrades
      # After environment changes, recreate the container with docker compose up -d

      # Optional: disable the public relay when using direct connections only
      # PASEO_RELAY_ENABLED: "false"

      # Available CLIs: codex,claude,opencode,gemini,qwen,kimi,copilot,pi,cline,amp
      # all = install all; none or empty string = install none
      AGENT_CLIS: "codex,claude,opencode,pi,kimi"

      # Comma-separated plugin sources; installed after the daemon is ready
      # Git Graph: https://paseo.sh/plugins/siyxo511/git-graph
      # Agent Usage: https://paseo.sh/plugins/casonmo/agent-usage (local Agent token usage statistics)
      # First setup enables plugins unless pluginsEnabled is already explicitly set
      # Existing versions and enabled/disabled states are preserved; failures retry on next start
      # Unset, empty or none skips installation; removing a source does not uninstall it
      PASEO_PLUGINS: "siyxo511/git-graph,casonmo/agent-usage"

      # Update interval in seconds; 0 disables periodic checks
      # Updates are postponed while the corresponding Agent is running
      CLI_UPDATE_INTERVAL: "86400"

    volumes:
      # Daemon state, installed plugins and their settings, user configuration and Agent authentication
      - paseo-home:/home/node

      # Installed Agent CLIs; avoid concurrent updates when sharing this volume
      - agent-cli:/opt/agent-cli

      # Project workspace
      - ./workspace:/workspace

volumes:
  paseo-home:
  agent-cli:
