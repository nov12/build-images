# Pairing: docker compose exec t3code t3 pair

services:
  t3code:
    image: ghcr.io/nov12/t3code:latest
    pull_policy: always
    container_name: t3code
    restart: unless-stopped

    # UID:GID; mounts must be writable.
    user: "${PUID:-666}:${PGID:-666}"

    # Reverse proxies must forward WebSockets.
    ports:
      - "3773:3773"

    environment:
      # All | Trace | Debug | Info | Warn | Error | Fatal | None
      # T3CODE_LOG_LEVEL: "${T3CODE_LOG_LEVEL:-Info}"

      # codex,claude,opencode,gemini,qwen,kimi,copilot,pi,cline,amp,agy | all | none (name@version except agy)
      AGENT_CLIS: "${AGENT_CLIS-codex,claude,opencode,pi,kimi}"

      # Update interval in seconds; 0 = startup only.
      CLI_UPDATE_INTERVAL: "${CLI_UPDATE_INTERVAL:-86400}"

      # skip | update | overwrite
      CLI_INSTALL_MODE: "${CLI_INSTALL_MODE:-update}"

      # go,dotnet,python,uv,rust,node,bun,deno,java | none (supports name@version)
      EXTRA_TOOLS: "${EXTRA_TOOLS-}"

      # Comma-separated Python packages, e.g. requests,ruff (auto-enables python).
      PYTHON_PACKAGES: "${PYTHON_PACKAGES-}"

      # skip | update | overwrite
      TOOLS_INSTALL_MODE: "${TOOLS_INSTALL_MODE:-update}"

      # Startup check interval in seconds; 0 = reuse.
      TOOLS_UPDATE_INTERVAL: "${TOOLS_UPDATE_INTERVAL:-86400}"

      # Proxy URLs.
      # HTTP_PROXY: "${HTTP_PROXY:-}"
      # HTTPS_PROXY: "${HTTPS_PROXY:-}"
      # ALL_PROXY: "${ALL_PROXY:-}"
      # NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,::1}"

      # Provider API keys.
      # OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      # GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"

    volumes:
      # T3 data, CLI logins, and tools.
      - t3-home:/home/node

      # Project workspace.
      - ./workspace:/workspace

      # Shared CLI/tool mounts across containers.
      # - /srv/shared/agent-cli:/home/node/agent-cli
      # - /srv/shared/extra-tools:/home/node/extra-tools
      # - /srv/shared/pythonlib:/home/node/pythonlib
      # - /srv/shared/uvenvs:/home/node/uvenvs

volumes:
  t3-home:
