# Login URL: docker compose logs deepseek-harness

services:
  deepseek-harness:
    image: ghcr.io/nov12/deepseek-harness:latest
    pull_policy: always
    container_name: deepseek-harness
    restart: unless-stopped

    # UID:GID; mounts must be writable.
    user: "${PUID:-666}:${PGID:-666}"

    # Local only; for LAN use "3080:3080" and set DSH_TRUSTED_HOSTS.
    # Reverse proxies must preserve Host and forward WebSockets.
    ports:
      - "127.0.0.1:3080:3080"

    environment:
      # Fixed Web login token (empty = random on startup; e.g. openssl rand -hex 32).
      DSH_TOKEN: "${DSH_TOKEN:-}"

      # read-only | workspace-write | danger-full-access
      DSH_PERMISSION_MODE: "${DSH_PERMISSION_MODE:-danger-full-access}"
      
      # Browser-facing URL behind a reverse proxy.
      # DSH_PUBLIC_URL: "${DSH_PUBLIC_URL:?Set browser-facing URL}"

      # Allowed Host headers (comma-separated domain/IP or host:port).
      # DSH_TRUSTED_HOSTS: "${DSH_TRUSTED_HOSTS:?Set allowed host or host:port list}"

      # DeepSeek API key (can also be set in Web UI).
      # DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"

      # Custom model/search API base URLs.
      # DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:?Set model API base URL}"
      # DEEPSEEK_SEARCH_BASE_URL: "${DEEPSEEK_SEARCH_BASE_URL:?Set search API base URL}"

      # FEEDBACK_ONLY | DISABLED
      # DSH_TELEMETRY_MODE: "${DSH_TELEMETRY_MODE:-FEEDBACK_ONLY}"

      # codex,claude,opencode,gemini,qwen,kimi,copilot,pi,cline,amp,agy | all | none (name@version except agy)
      AGENT_CLIS: "${AGENT_CLIS-none}"

      # Update interval in seconds; 0 = startup only.
      CLI_UPDATE_INTERVAL: "${CLI_UPDATE_INTERVAL:-86400}"

      # skip | update | overwrite
      CLI_INSTALL_MODE: "${CLI_INSTALL_MODE:-update}"

      # go,dotnet,python,uv,rust,node,bun,deno,java | none (supports name@version)
      EXTRA_TOOLS: "${EXTRA_TOOLS-}"

      # Comma-separated Python packages, e.g. requests,ruff (auto-enables python).
      PYTHON_PACKAGES: "${PYTHON_PACKAGES-}"

      # skip | update | overwrite
      TOOLS_INSTALL_MODE: "${TOOLS_INSTALL_MODE:-update}"

      # Startup check interval in seconds; 0 = reuse.
      TOOLS_UPDATE_INTERVAL: "${TOOLS_UPDATE_INTERVAL:-86400}"

      # Proxy URLs.
      # HTTP_PROXY: "${HTTP_PROXY:-}"
      # HTTPS_PROXY: "${HTTPS_PROXY:-}"
      # ALL_PROXY: "${ALL_PROXY:-}"
      # NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,::1}"

    volumes:
      # DSH settings, sessions, plugins, and tools.
      - dsh-home:/home/node

      # Project workspace.
      - ./workspace:/workspace

      # Shared CLI/tool mounts across containers.
      # - /srv/shared/agent-cli:/home/node/agent-cli
      # - /srv/shared/extra-tools:/home/node/extra-tools
      # - /srv/shared/pythonlib:/home/node/pythonlib
      # - /srv/shared/uvenvs:/home/node/uvenvs

      # Local plugins: dsh plugin --profile web add /plugins/my-plugin
      # - ./plugins:/plugins

volumes:
  dsh-home:
