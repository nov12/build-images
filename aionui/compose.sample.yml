services:
  aionui:
    image: ghcr.io/nov12/aionui:latest
    pull_policy: always
    container_name: aionui
    hostname: aionui
    restart: unless-stopped

    user: "${PUID:-666}:${PGID:-666}"

    ports:
      - "25808:25808"

    environment:
      # Optional tools; for example go@1.26,python@3.13
      # EXTRA_TOOLS: "go@1.26,python@3.13"

      AIONUI_ALLOW_REMOTE: "1"
      AIONUI_DATA_DIR: "/data"

      # Available CLIs: codex,claude,opencode,gemini,qwen,kimi,copilot,pi,cline,amp,agy
      # all = install all; none or empty string = install none
      AGENT_CLIS: "codex,claude,opencode,pi,kimi"

      # Update interval in seconds; 0 disables periodic checks
      # Updates are postponed while the corresponding Agent is running
      CLI_UPDATE_INTERVAL: "86400"

    volumes:
      # Database, assistants, skills and application settings
      - aionui-data:/data

      # User configuration and Agent authentication
      - aionui-home:/home/node
      # Tools and Python packages persist in the home volume above.
      # Optional: share individual directories using the same host paths in other containers.
      # - /srv/shared/agent-cli:/home/node/agent-cli
      # - /srv/shared/extra-tools:/home/node/extra-tools
      # - /srv/shared/pythonlib:/home/node/pythonlib
      # - /srv/shared/uvenvs:/home/node/uvenvs

      # Project workspace
      - ./workspace:/workspace

volumes:
  aionui-data:
  aionui-home:
